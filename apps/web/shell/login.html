<section id="login" class="welcome">
  <div class="welcome-story">
    <p class="eyebrow">REMEMBER ME · 勿忘我</p>
    <h1>把讲过的日子，<br>慢慢留成一座花园。</h1>
    <p class="welcome-lead">留下声音，也留下声音背后的那个人。<br>从一段故事，走近他的经历、牵挂与选择。</p>
    <div class="welcome-flower" aria-hidden="true"><img src="/brand/v20/bloom-cupped.png" alt=""><img src="/brand/v21/stem.png" alt=""></div>
    <div class="welcome-steps"><span><b>01</b> 留下讲述</span><span><b>02</b> 核对理解</span><span><b>03</b> 与亲友分享</span></div>
  </div>
  <div class="welcome-entry">
    <p class="eyebrow">从这里开始</p><h2>先走进一段故事。</h2>
    <p class="muted">无需安装。在浏览器里，听一听、看一看，再问一个你想了解的问题。</p>
    <div id="demoEntry" hidden>
      <button id="demoReader" class="entry-button primary" hidden><span>以亲友身份体验</span><small>阅读已分享的故事，查看来源与问答</small><span aria-hidden="true">↗</span></button>
      <button id="demoOwner" class="entry-button" hidden><span>走进陈守义的花田</span><small>与当前 App 使用同一份陈守义演示资料</small><span aria-hidden="true">↗</span></button>
      <p class="demo-note">当前入口为陈守义的独立虚构演示空间。请只上传属于这一人物的演示资料。</p>
      <div class="entry-divider">或使用自己的账号</div>
    </div>
    <div class="account-fields"><label>账号<input id="username" autocomplete="username" placeholder="输入已有账号"></label><label>密码<input id="password" type="password" autocomplete="current-password" placeholder="输入密码（至少 8 位）"></label></div>
    <label id="nameField" hidden>怎么称呼你<input id="displayName" autocomplete="nickname"></label>
    <button id="accountEnter" class="account-enter">登录我的空间</button><button id="switchRegister" hidden>第一次使用，创建账号</button>
    <p id="registrationNote" class="muted entry-footnote">正在连接记忆服务…</p>
    <div hidden><input id="token" type="password" autocomplete="off"><button id="enter">连接开发身份</button></div>
    <a id="apkDownload" class="apk-download" hidden rel="noopener">下载 Android 安装包</a>
  </div>
</section>
