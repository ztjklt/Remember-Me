name: Android CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # JVM tests and APK compilation do not need the team's physical Mac.
    # Keep device checks separate so an offline self-hosted runner cannot block CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android compile SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify runner isolation
        shell: bash
        run: |
          test -z "${ANTHROPIC_AUTH_TOKEN:-}"
          test -z "${ANTHROPIC_BASE_URL:-}"
          test -z "${ANTHROPIC_MODEL:-}"
          test -z "${SSH_AUTH_SOCK:-}"
      - name: Verify toolchain
        shell: bash
        run: |
          test -x "$JAVA_HOME/bin/java"
          test -d "$ANDROID_SDK_ROOT"
          "$JAVA_HOME/bin/java" -version
          ./gradlew --version
      # CI exercises a local development build, not the signed cloud APK.
      # Team cloud downloads are versioned separately in GitHub Releases.
      - name: Test and build local Twin review app
        run: ./gradlew --no-daemon test assembleDebug -PrememberServiceUrl=http://10.0.2.2:8891 --stacktrace
      - name: Record APK checksum and source
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          apk.with_suffix('.sha256').write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + '  app-debug.apk\n')
          apk.with_suffix('.json').write_text(json.dumps({
              'build': 'debug-local-twin-review', 'server': 'http://10.0.2.2:8891',
              'source_commit': os.environ['GITHUB_SHA'], 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'requires_account': True, 'public_https': False, 'registration_allowed': False,
              'requires_local_backend': True, 'ecs_deployed': False,
          }, indent=2))
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remember-me-local-twin-review-${{ github.run_id }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.*
          if-no-files-found: error
          retention-days: 7
