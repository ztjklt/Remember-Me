name: Android CI

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Configure Gradle network
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const raw = process.env.HTTPS_PROXY || process.env.https_proxy || process.env.HTTP_PROXY || process.env.http_proxy;
          let options = "-Djava.net.preferIPv4Stack=true";
          if (raw) {
            const proxy = new URL(raw);
            const port = proxy.port || (proxy.protocol === "https:" ? "443" : "80");
            options += ` -Dhttps.proxyHost=${proxy.hostname} -Dhttps.proxyPort=${port}`;
            options += ` -Dhttp.proxyHost=${proxy.hostname} -Dhttp.proxyPort=${port}`;
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `GRADLE_OPTS=${options}\n`);
          NODE
      - name: Run Android unit tests
        run: gradle test --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
