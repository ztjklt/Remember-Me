name: AI Core CI

on:
  pull_request:
    paths:
      - "services/ai-core/**"
      - "packages/contracts/**"
      - ".github/workflows/ai-core-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "services/ai-core/**"
      - "packages/contracts/**"
      - ".github/workflows/ai-core-ci.yml"

permissions:
  contents: read

jobs:
  ai-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: services/ai-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; repo baseline
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Validate AI Core and frozen contract compatibility
        run: uv run --locked pytest -q
      - name: Build standalone wheel
        run: uv build --wheel
      - name: Verify installed layout and fixture HTTP flow
        run: uv run --locked python scripts/check_wheel.py
