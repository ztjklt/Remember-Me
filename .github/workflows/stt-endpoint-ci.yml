name: STT Endpoint Check CI

on:
  pull_request:
    paths:
      - "scripts/verify_stt_endpoint.py"
      - "scripts/test_verify_stt_endpoint.py"
      - "docs/team/PHASE1_STT_ENDPOINT_CHECK.md"
      - ".github/workflows/stt-endpoint-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "scripts/verify_stt_endpoint.py"
      - "scripts/test_verify_stt_endpoint.py"
      - "docs/team/PHASE1_STT_ENDPOINT_CHECK.md"
      - ".github/workflows/stt-endpoint-ci.yml"

permissions:
  contents: read

jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.7"
          python-version: "3.13"
      - name: Install locked Backend dependencies
        run: uv sync --locked
      - name: Test STT wire and safe failures
        run: uv run --locked python ../../scripts/test_verify_stt_endpoint.py
