<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>留给你 · 勿忘我</title><link rel="stylesheet" href="/receive/receipt.css"><script defer src="/receive/receipt.js"></script></head>
<body><main>
<header><span class="flower" aria-hidden="true">✿</span><span>勿忘我</span><span class="small">一份专属的托付</span></header>
<section id="gate" class="card">
<p class="eyebrow">留给你</p><h1>有些话，<br>只想说给你听。</h1>
<p class="muted">验证留下的手机号或邮箱，就能打开这份内容。无需注册账号。</p>
<form id="contactForm"><label for="contact">你的手机号或邮箱</label><input id="contact" autocomplete="off" maxlength="254" placeholder="请输入对方指定的联系方式" required><button id="send" type="submit">获取验证码</button></form>
<form id="verifyForm" hidden><label for="code">验证码</label><p id="sentTo" class="muted"></p><input id="code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位验证码" required><button id="verify" type="submit">打开这份托付</button></form>
</section>
<section id="opened" hidden><div class="card"><p class="eyebrow" id="forYou"></p><h1 id="title"></h1><p id="message" class="message"></p><div class="divider"></div><p class="muted">这里仅包含对方专门留给你的内容。</p></div><div id="sources"></div><button id="end" class="secondary">关闭这份内容</button></section>
<p id="notice" role="status" aria-live="polite"></p>
<footer>声音与故事，留给重要的人。</footer>
</main></body></html>
