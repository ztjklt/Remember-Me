[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remember-me-ai-core"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "remember-me-contracts",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "jsonschema>=4.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "app/fixtures"

[tool.uv.sources]
remember-me-contracts = { path = "../../packages/contracts", editable = true }
