[project]
name = "remember-me-realtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "livekit-agents==1.8.6",
  "livekit-plugins-silero==1.8.6",
  "httpx>=0.28,<1",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
