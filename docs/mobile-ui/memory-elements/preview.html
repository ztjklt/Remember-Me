<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>勿忘我 · 回忆图形组件</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e4e9f2;color:#243349;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1060px;margin:auto;padding:40px 24px}h1{font-size:30px;font-weight:500;margin:10px 0}p{color:#536176}a{color:#325ccb}.brand{display:flex;align-items:center;gap:10px;font-size:14px}.brand img{width:28px}.intro{max-width:660px}.controls{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin:28px 0;padding:18px 0;border-block:1px solid #cbd4e3}select{font:inherit;padding:10px;border:1px solid #bac7db;border-radius:10px;background:#edf2fb;color:#243349}label{display:flex;align-items:center;gap:10px}input{min-height:44px}h2{font-size:19px;font-weight:500;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#d4dce9;border-radius:24px;overflow:hidden;border:1px solid #d4dce9}.tile{text-align:center;background:radial-gradient(ellipse at 20% 0,#f3f6fc00,#e5e7f0),#eaf0f9;padding:28px 16px}.art{height:146px;display:grid;place-items:center}.tile p{font-size:13px;margin:4px 0 0}.small-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}.small-row span{font-size:12px;color:#536176}.night{background:#171f30;border-radius:24px;margin-top:24px;padding:28px;color:#e6edfa}.night h2{margin-bottom:18px}.night-grid{display:flex;justify-content:space-around;gap:12px;flex-wrap:wrap}.notes{margin-top:28px;max-width:720px;font-size:14px}code{color:#344e8f}button{font:inherit;min-height:48px;background:#325ccb;color:white;border:0;border-radius:12px;padding:10px 16px;cursor:pointer}button:active{background:#243f99}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #325ccb;outline-offset:4px}@media(max-width:600px){.wrap{padding:24px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:25px}.tile{padding:20px 8px}.art{height:136px}}
</style><main class="wrap"><div class="brand"><img src="../brand/mark-flat.svg" alt="">勿忘我 · MEMORY LEAVES</div><div class="intro"><h1>把回忆，轻轻收好。</h1><p>六个共用轮廓的图形。纸页叠层、被遮住的柔影、透光边缘与一点金色，来自“留下、收好、再回望”的动作。</p><a href="../prototype.html?v=6">回到应用原型 →</a></div>
<div class="controls"><label>材质<select id="treatment"><option value="auto">自动</option><option value="flat">单色</option><option value="duotone">双色</option><option value="material">蒙版与柔影</option></select></label><label>尺寸<input id="size" type="range" min="24" max="128" value="96" step="8"><output id="sizeValue">96</output></label><button id="reset">恢复默认</button></div><div class="grid" id="grid"></div><section class="night"><h2>夜色中的回忆</h2><div class="night-grid" id="night"></div></section><div class="notes"><p>24：单色轮廓，用于条目辅助标记。48：双色，保留形状层次。96：蒙版与柔影，适合空状态。所有图形保持静止，按钮仍使用明确文字和系统操作图标。</p><p>组件：<code>&lt;memory-glyph name="memory" size="96"&gt;</code>。默认是装饰；独立传达含义时设置 label。SVG、路径目录与双端组件均随项目提供。</p></div></main>
<script type="module">import './memory-glyph.js';import {catalog} from './catalog.js';const names=Object.keys(catalog);document.querySelector('#grid').innerHTML=names.map(name=>`<article class="tile"><div class="art"><memory-glyph class="adjustable" name="${name}" size="96" theme="light"></memory-glyph></div><h2>${catalog[name].label}</h2><p>${catalog[name].description}</p><div class="small-row"><memory-glyph name="${name}" size="24" theme="light"></memory-glyph><span>24</span><memory-glyph name="${name}" size="48" theme="light"></memory-glyph><span>48</span></div></article>`).join('');document.querySelector('#night').innerHTML=names.map(name=>`<memory-glyph class="adjustable" name="${name}" size="96" theme="dark"></memory-glyph>`).join('');function render(){document.querySelector('#sizeValue').value=document.querySelector('#size').value;for(const el of document.querySelectorAll('.adjustable')){el.setAttribute('size',document.querySelector('#size').value);el.setAttribute('treatment',document.querySelector('#treatment').value);}}document.querySelector('#size').addEventListener('input',render);document.querySelector('#treatment').addEventListener('change',render);document.querySelector('#reset').onclick=()=>{document.querySelector('#size').value=96;document.querySelector('#treatment').value='auto';render();};</script></html>
