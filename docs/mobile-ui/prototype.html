<div class="lab"><aside class="intro"><div class="brand"><svg><use href="#flower"/></svg>勿忘我 <span class="small">Remember Me</span></div><div class="kicker">MOBILE DESIGN STUDY · 02 / 声音留下的形状</div><h1>有些声音，<br>值得一直留着。</h1><p>雾银的留白，勿忘我蓝的声音印记。<br>像打开一件珍藏，也像按下一枚熟悉的录音键。</p>
<div class="tools"><label>平台 <select id="platform"><option value="android">Android</option><option value="ios">iOS</option></select></label><label><input id="dark" type="checkbox">深色</label><label><input id="large" type="checkbox">200% 文字</label><label><input id="reduce" type="checkbox">减少动态</label><label>场景 <select id="scenario"><option value="content">已有记录</option><option value="empty">空档案</option><option value="error">处理失败</option><option value="loading">处理中</option></select></label></div>
<div class="jump"><button data-go="home">首页</button><button data-go="record">录音</button><button data-go="archive">档案</button><button data-go="review">核对文字</button><button data-go="memory">记忆详情</button><button data-go="profile">我的</button><button data-go="system">设计规范</button></div>
<div class="facts">设计原型使用固定示例资料，不调用麦克风与云端。<br>原生版本以真实保存、播放及处理状态为准。<br>第一批：录音 → 保存 → 核对 → 明确授权 → 记忆。</div></aside>
<main class="phone" aria-label="移动端交互原型"><div class="status"><span>9:41</span><span>▰ ▰ ▰</span></div><div class="demo">交互原型 · 示例资料 · 不录音、不联网</div><div id="screen" class="screen"></div><div id="dock"></div><nav id="nav" class="bottomnav" aria-label="主导航"></nav></main></div><div id="modal" class="overlay hidden" role="dialog" aria-modal="true"></div>
<script>
const $=s=>document.querySelector(s),icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;

// Decorative brand engraving, not an audio waveform or a recording visualization.
const seal=()=>'<svg class="voice-seal" viewBox="0 0 340 210" aria-hidden="true">'+Array.from({length:32},(_,i)=>{const r=.21+i*.024;let d='';for(let j=0;j<=120;j++){const a=j/120*Math.PI*2,k=1+.15*Math.cos(3*a)+.07*Math.sin(5*a);d+=(j?'L':'M')+(170+123*r*k*Math.cos(a)).toFixed(2)+' '+(101+73*r*k*Math.sin(a)+20*r*Math.cos(a)).toFixed(2);}return '<path d="'+d+'Z" opacity="'+(.36+i/54)+'"/>';}).join('')+'</svg>';
let page='home',mode='recordings',scenario='content',recording=false,paused=false,ticks=0,playing=false,position=0,reviewed=false,deleted=false,search='';
const sample='小时候，外婆家的院子里有一棵桂花树。每到秋天，她会把落下的花收在小罐子里。我记得的，是午后一起坐在树下的那段时间。';
let reviewText=sample;
const escapeHtml=value=>value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const time=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
const primary=(label,action,ico='mic')=>`<button class="primary" data-action="${action}">${icon(ico)}${label}</button>`;
const toolbar=title=>`<div class="toolbar"><button data-action="back" aria-label="返回">${icon('back')}</button><span class="small">${title}</span><span style="width:48px"></span></div>`;
const notice=(title,body,error=false)=>`<div class="notice ${error?'error':''}" role="status"><strong>${title}</strong>${body}</div>`;
const row=(title,date,duration,status)=>`<button class="entry" data-go="review"><span class="iconbox">${icon('wave')}</span><span><strong>${title}</strong><span class="small">${date} · ${duration}</span><span class="pill">${status}</span></span>${icon('arrow')}</button>`;
const player=()=>`<div class="player"><div class="player-head"><button class="play" data-action="play" aria-label="${playing?'暂停':'播放'}示例进度">${icon(playing?'pause':'play')}</button><div><strong>原始录音</strong><div class="small"><span id="position">${time(position)}</span> / 02:18 · 模拟播放</div></div></div><input type="range" min="0" max="138" value="${position}" id="seek" aria-label="示例播放进度"></div>`;
function navigate(next){page=next;playing=false;render();$('#screen').scrollTop=0;}
function render(){let body='',dock='';
if(page==='home'){body=`<div class="home-head"><strong>勿忘我</strong><span class="small">9月27日 · 星期日</span></div><h1 class="home-title">留住此刻的声音。</h1><div class="voice-stage">${seal()}</div><button class="record-entry" data-action="record"><span class="record-disc">${icon('mic')}</span><span><strong>开始录音</strong><span class="small">原音先留在手机</span></span>${icon('arrow')}</button>${scenario==='empty'?'':`<button class="resume" data-go="review">${icon('book')}<span><strong>继续核对 · 老屋的桂花香</strong></span>${icon('arrow')}</button>`}<div class="section"><h2>最近留下的声音</h2><button class="text-button" data-go="archive">全部</button></div>${scenario==='empty'?notice('从第一段声音开始','不必准备完整的故事。录完之后，可以随时回来听。'):row('老屋的桂花香','今天 10:24','02:18','待核对文字')+row('周末想走一条不同的路','9月25日','01:46','已整理')}`;}
if(page==='record'){body=toolbar('留下一段声音')+`<div class="capture"><h1>${paused?'慢慢来。':recording?'我在听。':'把此刻，留在这里。'}</h1><p class="small" role="status">${paused?'已暂停':recording?'正在模拟录音':'由你决定什么时候开始'}</p><div class="timer" id="timer">${time(ticks)}</div><div class="wave-console"><div class="wave ${recording&&!paused?'active':''}" aria-label="原型演示波形">${Array.from({length:27},(_,i)=>`<i style="height:${12+Math.abs(Math.sin(i*1.2))*65}px;--i:${i}"></i>`).join('')}</div></div><p class="small capture-note">不必组织完整的句子。<br>一个念头，也值得留下。</p></div>`;dock=recording?`<button class="secondary" data-action="pause">${icon(paused?'play':'pause')}${paused?'继续录音':'暂停录音'}</button>${primary('完成并保存','save','stop')}`:primary('开始录音','start');}
if(page==='saved'){body=toolbar('录音已保存')+`<div class="capture">${icon('check')}<h1>这一段，留下了。</h1><p class="small">录音已保存在手机 · 示例状态</p></div>${player()}${notice('原音是起点','你可以现在核对文字，也可以稍后从档案继续。')}`;dock=primary('转成文字','transcribe','book')+`<button class="text-button" data-action="again">再录一段</button>`;}
if(page==='archive'){body=`<h1>声音与记忆</h1><p class="small">说过的话，完整留着。</p><label class="search">${icon('search')}<input id="query" placeholder="搜索标题、文字或记忆" aria-label="搜索档案"></label><div class="tabs" role="tablist"><button role="tab" aria-selected="${mode==='recordings'}" data-action="recordings">录音</button><button role="tab" aria-selected="${mode==='memories'}" data-action="memories">记忆</button></div><div id="results">${archiveResults()}</div>`;}
if(page==='review'){body=toolbar('录音详情')+`<h1>老屋的桂花香</h1><p class="small">9月27日 10:24 · 02:18</p>${player()}${scenario==='error'?notice('整理未完成','原音和核对文字仍在。可以稍后重试。',true):scenario==='loading'?notice('正在转成文字','原音已保存。可以离开页面稍后查看。<div class="loading"></div>'):notice(reviewed?'核对文字已保存':'先核对，再留下记忆',reviewed?'机器原始转写仍然保留。':'听听原音，修改识别不准确的地方。')}<h2>核对文字</h2><textarea class="editor" id="transcript" aria-label="核对并修改转写文字">${escapeHtml(reviewText)}</textarea><details class="details"><summary>来源与处理详情</summary><p class="small">机器原始转写：${sample}</p><p class="small">此处为固定示例；原生版本显示实际来源与处理版本。</p></details>`;dock=primary(scenario==='error'?'重试整理':'确认文字并整理记忆','organize','check')+`<button class="text-button" data-action="save-review">只保存核对文字</button>`;}
if(page==='memory'){body=toolbar('记忆详情')+`<div class="memory-mast">${seal()}<div class="eyebrow">本人叙述 · 示例记忆</div></div><h1 class="memory-title">有些记忆，<br>是桂花的味道。</h1><p class="memory-copy">小时候，你常和外婆坐在桂花树下。比起花香，你更记得一起度过的午后。</p><div class="section"><h2>当时说过的话</h2></div><blockquote class="quote">“我记得的，是午后一起坐在树下的那段时间。”</blockquote><p class="small">来自：老屋的桂花香 · 9月27日</p>${player()}<button class="text-button danger" data-action="delete">删除这条记忆</button>`;}
if(page==='profile'){body=`<h1>由你决定<br>留下什么。</h1>${notice('原音留在手机','录音与核对文字先保存在本机。录音时不会自动上传。')}<div class="feature"><h2>数据与授权</h2><p class="small">整理文字需要另行确认。录音授权不代表声音克隆授权。</p><button class="secondary" data-action="permissions">管理麦克风权限</button></div><div class="feature"><h2>外观</h2><p>跟随系统</p><p class="small">支持大字号与减少动态效果。</p></div><div class="feature"><h2>整理服务</h2><p>此处为设计预览</p><p class="small">原生版本仅在适配器就绪后启用整理，不包含供应商密钥。</p></div>`;}
if(page==='conversation'){body=`<h1>问一个关于<br>自己的问题。</h1>${notice('iOS 对话入口','此原型只展示导航位置。真实客户端保留原话、推测、证据及独立授权流程。')}<p class="small">本轮不使用虚构答案展示真实服务能力。</p>`;}
if(page==='system'){body=toolbar('组件与规范')+`<h1>声音的纹理，<br>记忆的留白。</h1><div class="feature"><h2>颜色与层级</h2><p class="small">雾银背景、稳定内容面、墨蓝正文、勿忘我蓝主操作。首页纹理仅为品牌装饰，录音波形反映真实音量。</p><div style="display:flex;gap:12px"><span style="width:48px;height:48px;border-radius:12px;background:var(--primary)"></span><span style="width:48px;height:48px;border-radius:12px;background:var(--soft)"></span><span style="width:48px;height:48px;border-radius:12px;background:var(--accent)"></span></div></div><div class="feature"><h2>字号</h2><p>正文 17 / 26</p><p class="small">辅助文字 14 / 20。文字随系统缩放。</p></div>${primary('主操作示例','sample','check')}<button class="secondary" data-action="sample">次操作示例</button>${notice('状态反馈','重要结果用文字说明，不只依赖颜色。')}`;}
$('#screen').innerHTML=`<section class="page">${body}</section>`;$('#dock').className=dock?'dock':'';$('#dock').innerHTML=dock;$('#nav').classList.toggle('hidden',!['home','archive','profile','conversation'].includes(page));$('#nav').innerHTML=[['home','sun','今天'],['archive','book','档案'],...($('#platform').value==='ios'?[['conversation','chat','对话']]:[]),['profile','person','我的']].map(([p,i,t])=>`<button data-go="${p}" ${page===p?'aria-current="page"':''}>${icon(i)}${t}</button>`).join('');if($('#query'))$('#query').value=search;
}
function archiveResults(){if(scenario==='empty'||(mode==='memories'&&deleted))return notice('还没有可显示的内容','原音与记忆分开保留，从第一段声音开始。');if(search&&!('老屋的桂花香'+sample).includes(search))return notice('没有找到相关内容','换个词试试，或清空搜索。');return mode==='recordings'?`<h2>今天</h2>${row('老屋的桂花香','10:24','02:18','待核对文字')}`:`<button class="entry" data-go="memory"><span><span class="small">本人叙述 · 有原音来源</span><strong>有些记忆，是桂花的味道。</strong><span class="small">来自：老屋的桂花香</span></span>${icon('arrow')}</button>`;}
let previousFocus;
function dialog(title,body,yes,action){previousFocus=document.activeElement;$('#modal').innerHTML=`<div class="dialog"><h2 id="dialog-title">${title}</h2><p>${body}</p>${primary(yes,action,'check')}<button class="secondary" data-action="dismiss">取消</button></div>`;$('#modal').setAttribute('aria-labelledby','dialog-title');$('#modal').classList.remove('hidden');$('#modal button').focus();}
function dismiss(){$('#modal').classList.add('hidden');previousFocus?.focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){navigate(b.dataset.go);return;}const a=b.dataset.action;if(a==='record'){ticks=0;recording=false;navigate('record');}if(a==='start')dialog('开始录下这段声音？','原生版本会在同意后请求麦克风权限。此原型仅模拟状态，不采集声音。','同意并开始','confirm-start');if(a==='confirm-start'){dismiss();recording=true;paused=false;render();}if(a==='pause'){paused=!paused;render();}if(a==='save'){recording=false;navigate('saved');}if(a==='again'){ticks=0;recording=false;navigate('record');}if(a==='transcribe'){scenario='loading';navigate('review');setTimeout(()=>{scenario='content';if(page==='review')render();},900);}if(a==='organize'){dialog('确认文字并整理记忆？','真实版本会说明资料去向，并只发送核对后的文字。本预览不会发送任何内容。','同意并整理','confirm-organize');}if(a==='confirm-organize'){dismiss();reviewed=true;deleted=false;scenario='content';navigate('memory');}if(a==='save-review'){reviewed=true;render();}if(a==='play'){playing=!playing;const y=$('#screen').scrollTop;render();$('#screen').scrollTop=y;}if(a==='recordings'||a==='memories'){mode=a;render();}if(a==='delete')dialog('删除这条记忆？','它将从示例列表中移除，原始录音和转写保留。','删除记忆','confirm-delete');if(a==='confirm-delete'){dismiss();deleted=true;mode='memories';navigate('archive');}if(a==='dismiss')dismiss();if(a==='permissions'||a==='sample')dialog('原型说明','原生版本使用系统权限与控件反馈。此处不改变设备设置。','知道了','dismiss');if(a==='back'){if(page==='record'&&recording)dialog('要结束这段录音吗？','完成后保留原音。','完成并保存','close-record');else navigate(page==='memory'?'archive':'home');}if(a==='close-record'){dismiss();recording=false;navigate('saved');}});
document.addEventListener('input',e=>{if(e.target.id==='seek'){position=+e.target.value;$('#position').textContent=time(position);}if(e.target.id==='query'){search=e.target.value;$('#results').innerHTML=archiveResults();}});
$('#dark').onchange=e=>document.documentElement.classList.toggle('dark',e.target.checked);$('#large').onchange=e=>{document.documentElement.style.setProperty('--scale',e.target.checked?2:1);document.documentElement.classList.toggle('large',e.target.checked);};$('#reduce').onchange=e=>document.documentElement.classList.toggle('reduce',e.target.checked);$('#platform').onchange=e=>{$('.phone').classList.toggle('ios',e.target.value==='ios');render();};$('#scenario').onchange=e=>{scenario=e.target.value;render();};
document.addEventListener('input',e=>{if(e.target.id==='transcript')reviewText=e.target.value;});
document.addEventListener('keydown',e=>{if($('#modal').classList.contains('hidden'))return;if(e.key==='Escape')dismiss();if(e.key==='Tab'){const bs=[...$('#modal').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===bs.at(-1)){e.preventDefault();bs[0].focus();}}});
setInterval(()=>{if(recording&&!paused&&page==='record'){ticks++;if($('#timer'))$('#timer').textContent=time(ticks);}if(playing){position=Math.min(138,position+1);if($('#position'))$('#position').textContent=time(position);if($('#seek'))$('#seek').value=position;if(position===138){playing=false;position=0;render();}}},1000);
render();
</script></body></html>
